<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Habit & Mood Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f0; color: #222; min-height: 100vh; }
    header { background: #2d2d2a; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 20px; font-weight: 600; }
    .date-label { margin-left: auto; font-size: 13px; opacity: 0.6; }
    .container { max-width: 600px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; }

    /* Cards */
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .card h2 { font-size: 14px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }

    /* Mood */
    .mood-grid { display: flex; gap: 10px; flex-wrap: wrap; }
    .mood-btn { font-size: 28px; background: none; border: 2px solid transparent; border-radius: 10px; padding: 6px 10px; cursor: pointer; transition: all 0.15s; }
    .mood-btn:hover { background: #f0f0eb; }
    .mood-btn.selected { border-color: #2d2d2a; background: #f0f0eb; }
    .mood-note { margin-top: 10px; width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; font-size: 14px; resize: none; }
    .save-btn { margin-top: 10px; background: #2d2d2a; color: white; border: none; border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 14px; }
    .save-btn:hover { background: #444; }

    /* Hábitos */
    .habit-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0eb; }
    .habit-row:last-child { border-bottom: none; }
    .habit-check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #ccc; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: all 0.15s; }
    .habit-check.done { background: #2d2d2a; border-color: #2d2d2a; color: white; }
    .habit-name { flex: 1; font-size: 15px; }
    .habit-icon { font-size: 20px; }
    .del-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 18px; }
    .del-btn:hover { color: #e55; }
    .add-habit { display: flex; gap: 8px; margin-top: 12px; }
    .add-habit input { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
    .add-habit select { border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 18px; }
    .add-habit button { background: #2d2d2a; color: white; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; }

    /* Historial */
    .history-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0eb; font-size: 14px; }
    .history-row:last-child { border-bottom: none; }
    .history-date { width: 90px; color: #888; }
    .progress-bar { flex: 1; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #2d2d2a; border-radius: 4px; transition: width 0.3s; }
    .history-mood { font-size: 20px; width: 28px; text-align: center; }
    .empty { color: #aaa; font-size: 14px; padding: 8px 0; }
  </style>
</head>
<body>
<header>
  <span style="font-size:22px">🌱</span>
  <h1>Habit & Mood Tracker</h1>
  <span class="date-label" id="today-label"></span>
</header>

<div class="container">

  <!-- Mood -->
  <div class="card">
    <h2>¿Cómo te sientes hoy?</h2>
    <div class="mood-grid">
      <button class="mood-btn" data-emoji="😄" onclick="selectMood(this)">😄</button>
      <button class="mood-btn" data-emoji="🙂" onclick="selectMood(this)">🙂</button>
      <button class="mood-btn" data-emoji="😐" onclick="selectMood(this)">😐</button>
      <button class="mood-btn" data-emoji="😔" onclick="selectMood(this)">😔</button>
      <button class="mood-btn" data-emoji="😤" onclick="selectMood(this)">😤</button>
    </div>
    <textarea class="mood-note" id="mood-note" rows="2" placeholder="Nota opcional..."></textarea>
    <button class="save-btn" onclick="saveMood()">Guardar mood</button>
  </div>

  <!-- Hábitos -->
  <div class="card">
    <h2>Hábitos de hoy</h2>
    <div id="habit-list"></div>
    <div class="add-habit">
      <select id="habit-icon">
        <option>💧</option><option>📚</option><option>🏃</option>
        <option>🧘</option><option>🥗</option><option>😴</option><option>✍️</option>
      </select>
      <input id="habit-input" type="text" placeholder="Nuevo hábito...">
      <button onclick="addHabit()">+ Agregar</button>
    </div>
  </div>

  <!-- Historial -->
  <div class="card">
    <h2>Últimos 7 días</h2>
    <div id="history-list"></div>
  </div>

</div>

<script>
  const API = 'http://localhost:3000';
  let selectedMood = null;
  let todayLogs = [];

  // Fecha de hoy
  const todayStr = new Date().toLocaleDateString('es-CO', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  document.getElementById('today-label').textContent = todayStr;

  async function load() {
    await Promise.all([loadHabits(), loadMood(), loadHistory()]);
  }

  async function loadHabits() {
    const [habits, logs] = await Promise.all([
      fetch(`${API}/habits`).then(r => r.json()),
      fetch(`${API}/logs`).then(r => r.json())
    ]);
    todayLogs = logs;
    const list = document.getElementById('habit-list');
    if (!habits.length) { list.innerHTML = '<p class="empty">Aún no tienes hábitos. ¡Agrega uno!</p>'; return; }
    list.innerHTML = habits.map(h => {
      const done = logs.some(l => l.habitId === h.id);
      return `
        <div class="habit-row">
          <button class="habit-check ${done ? 'done' : ''}" onclick="toggleHabit(${h.id})" title="Marcar">
            ${done ? '✓' : ''}
          </button>
          <span class="habit-icon">${h.icon}</span>
          <span class="habit-name" style="${done ? 'text-decoration:line-through;color:#aaa' : ''}">${h.name}</span>
          <button class="del-btn" onclick="deleteHabit(${h.id})" title="Eliminar">×</button>
        </div>`;
    }).join('');
  }

  async function loadMood() {
    const mood = await fetch(`${API}/mood`).then(r => r.json());
    if (!mood) return;
    selectedMood = mood.emoji;
    document.querySelectorAll('.mood-btn').forEach(b => {
      b.classList.toggle('selected', b.dataset.emoji === mood.emoji);
    });
    document.getElementById('mood-note').value = mood.note || '';
  }

  async function loadHistory() {
    const history = await fetch(`${API}/history`).then(r => r.json());
    const list = document.getElementById('history-list');
    list.innerHTML = history.map(day => {
      const pct = day.total ? Math.round((day.completed / day.total) * 100) : 0;
      const label = new Date(day.date + 'T12:00:00').toLocaleDateString('es-CO', { weekday:'short', day:'numeric', month:'short' });
      return `
        <div class="history-row">
          <span class="history-date">${label}</span>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span style="font-size:12px;color:#888;width:32px;text-align:right">${pct}%</span>
          <span class="history-mood">${day.mood ? day.mood.emoji : '—'}</span>
        </div>`;
    }).join('');
  }

  function selectMood(btn) {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.emoji;
  }

  async function saveMood() {
    if (!selectedMood) return alert('Selecciona un emoji primero');
    await fetch(`${API}/mood`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emoji: selectedMood, note: document.getElementById('mood-note').value })
    });
    loadHistory();
  }

  async function addHabit() {
    const input = document.getElementById('habit-input');
    const icon = document.getElementById('habit-icon').value;
    if (!input.value.trim()) return;
    await fetch(`${API}/habits`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: input.value.trim(), icon })
    });
    input.value = '';
    loadHabits();
  }

  async function toggleHabit(id) {
    await fetch(`${API}/logs/toggle`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ habitId: id })
    });
    loadHabits();
    loadHistory();
  }

  async function deleteHabit(id) {
    await fetch(`${API}/habits/${id}`, { method: 'DELETE' });
    loadHabits();
  }

  load();
</script>
</body>
</html>
